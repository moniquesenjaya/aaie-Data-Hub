name: Validate Dataset JSON Files

on:
  push:
    branches:
      - "**"  # Trigger on any branch in fork
    paths:
      - 'data/curated/*.json'
      - 'scripts/validation/validation.py'
      - 'data/schema/schema.json'
      - '.github/workflows/validate-json.yml'
      - 'requirements.txt'

  workflow_dispatch:  # Optional: allow manual runs from GitHub UI

jobs:
  run-validation:
    name: Run Validation on Pushed Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Validation Script
        run: |
          python scripts/validation/validate_json.py data/curated
